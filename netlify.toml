[build]
  publish = "dist"
  command = "npm run build"

# Redirects all SPA routes to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Optional: If you want Netlify to proxy /api requests to your backend server automatically,
# uncomment and set your backend server URL below:
# [[redirects]]
#   from = "/api/*"
#   to = "https://votre-backend.onrender.com/api/:splat"
#   status = 200
#   force = true
